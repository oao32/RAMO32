<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030711" />
  <title>Own Aura Outcome — 3D Logo</title>
  <style>
    :root { --orange: #ed651b; --navy: #07152e; --blue: #173f80; --silver: #bcc7d8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; overflow: hidden; display: grid; place-items: center; color: #fff; font-family: Arial, Tahoma, sans-serif; background: #030711; }
    body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .25; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(circle, #000 0%, transparent 72%); }
    .stage { position: relative; width: min(94vw, 760px); height: min(94vh, 760px); display: grid; place-items: center; perspective: 1200px; }
    .stage::before { content: ''; position: absolute; width: 52%; height: 24%; bottom: 11%; border-radius: 50%; background: rgba(0,0,0,.82); filter: blur(34px); transform: rotateX(70deg); animation: shadow-pulse 5s ease-in-out infinite; }
    .ambient { position: absolute; width: 60%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(237,101,27,.26), transparent 65%); filter: blur(35px); animation: ambient-breathe 4s ease-in-out infinite; }
    .light-beam { position: absolute; width: 22%; height: 76%; opacity: .2; background: linear-gradient(90deg, transparent, var(--orange), transparent); filter: blur(35px); transform: rotate(38deg); animation: light-sweep 7s ease-in-out infinite; }
    .logo-wrap { position: relative; z-index: 5; width: min(74vw, 440px); aspect-ratio: 1; transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .18s ease-out; animation: levitate 6s ease-in-out infinite; }
    .emblem-depth { position: absolute; inset: 0; transform: translateZ(-22px) scale(0.985); filter: drop-shadow(0 25px 45px rgba(0,0,0,0.95)) drop-shadow(0 0 30px rgba(237,101,27,0.4)) brightness(0.25) contrast(1.3); pointer-events: none; opacity: 0.95; }
    .emblem-depth img { width: 100%; height: 100%; object-fit: contain; }
    .emblem-main { position: absolute; inset: 0; transform: translateZ(32px); filter: drop-shadow(0 15px 30px rgba(0,0,0,0.8)) drop-shadow(0 0 35px rgba(237,101,27,0.5)); display: flex; align-items: center; justify-content: center; }
    .emblem-main img { display: block; width: 100%; height: 100%; object-fit: contain; transition: transform 0.4s ease; }
    .logo-wrap:hover .emblem-main img { transform: scale(1.05); }
    .specular-gleam { position: absolute; inset: 0; pointer-events: none; border-radius: 50%; background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,0.45) 50%, rgba(237,101,27,0.25) 58%, transparent 68%); mix-blend-mode: overlay; animation: gleam-sweep 5.5s ease-in-out infinite; opacity: 0.7; }
    .ring { position: absolute; z-index: 1; left: 50%; top: 50%; border: 1.5px solid rgba(237,101,27,.45); border-radius: 50%; transform-style: preserve-3d; pointer-events: none; }
    .ring::before { content: ''; position: absolute; left: 50%; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 18px 4px rgba(237,101,27,.85); }
    .ring-a { width: 125%; height: 50%; transform: translate(-50%, -50%) rotateX(67deg) rotateZ(12deg) translateZ(16px); animation: ring-a 12s linear infinite; }
    .ring-b { width: 148%; height: 60%; border-color: rgba(72,167,255,.35); transform: translate(-50%, -50%) rotateX(68deg) rotateY(18deg) translateZ(-5px); animation: ring-b 18s linear infinite reverse; }
    .ring-b::before { background: #48a7ff; box-shadow: 0 0 18px 4px rgba(72,167,255,.8); }
    .ring-c { width: 168%; height: 70%; border-color: rgba(189,203,226,.25); transform: translate(-50%, -50%) rotateX(70deg) rotateZ(-18deg) translateZ(-18px); animation: ring-c 23s linear infinite; }
    .caption { position: absolute; z-index: 8; bottom: 3%; display: flex; align-items: center; gap: 13px; color: #8d9bb3; font-size: 11px; font-weight: 800; letter-spacing: .28em; }
    .caption i { display: block; width: 46px; height: 1px; background: var(--orange); box-shadow: 0 0 10px var(--orange); }
    @keyframes levitate { 0%, 100% { translate: 0 0; } 50% { translate: 0 -13px; } }
    @keyframes ambient-breathe { 0%, 100% { opacity: .6; scale: 1; } 50% { opacity: .95; scale: 1.16; } }
    @keyframes shadow-pulse { 0%, 100% { scale: 1; opacity: .7; } 50% { scale: .8; opacity: .42; } }
    @keyframes light-sweep { 0%, 100% { translate: -180px 0; opacity: 0; } 45% { opacity: .3; } 70% { translate: 180px 0; opacity: 0; } }
    @keyframes gleam-sweep { 0%, 100% { opacity: 0; transform: translateX(-60%) rotate(25deg); } 30% { opacity: 0.85; } 60% { opacity: 0; transform: translateX(60%) rotate(25deg); } }
    @keyframes ring-a { to { rotate: 360deg; } }
    @keyframes ring-b { to { rotate: -360deg; } }
    @keyframes ring-c { to { rotate: 360deg; } }
    @media (max-width: 560px) { .logo-wrap { width: min(78vw, 340px); } .caption { bottom: 6%; font-size: 9px; } .ring-c { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="stage" aria-label="شعار Own Aura Outcome بتصميم ثلاثي الأبعاد">
    <div class="ambient"></div>
    <div class="light-beam"></div>
    <div class="logo-wrap" id="logo">
      <div class="ring ring-a"></div>
      <div class="ring ring-b"></div>
      <div class="ring ring-c"></div>

      <!-- 3D Depth Extrusion Layer -->
      <div class="emblem-depth" aria-hidden="true">
        <img src="./logo.png" alt="" />
      </div>

      <!-- Core 3D Free-Standing Emblem -->
      <div class="emblem-main">
        <img src="./logo.png" alt="Own Aura Outcome" />
        <div class="specular-gleam" aria-hidden="true"></div>
      </div>
    </div>
    <div class="caption">
      <i></i>
      <span style="display:inline-flex;align-items:center;gap:6px;font-weight:900;">
        <span style="color:#ffffff;">OWN</span>
        <span style="background:linear-gradient(to right, #f1f5f9, #ffffff, #e2e8f0);color:#07182E;padding:2px 7px;border-radius:4px;font-size:10px;border:1px solid #cbd5e1;box-shadow:0 1px 4px rgba(0,0,0,0.2);">AURA</span>
        <span style="color:#ed651b;">OUTCOME</span>
      </span>
      <i></i>
    </div>
  </main>
  <script>
    const logo = document.getElementById('logo');
    const stage = document.querySelector('.stage');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion) {
      stage.addEventListener('pointermove', (event) => {
        const box = stage.getBoundingClientRect();
        const x = (event.clientX - box.left) / box.width - 0.5;
        const y = (event.clientY - box.top) / box.height - 0.5;
        logo.style.setProperty('--ry', `${x * 16}deg`);
        logo.style.setProperty('--rx', `${y * -14}deg`);
      });
      stage.addEventListener('pointerleave', () => {
        logo.style.setProperty('--ry', '0deg');
        logo.style.setProperty('--rx', '0deg');
      });
    }
  </script>
</body>
</html>
